name: macOS Release

on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild and publish
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-release:
    runs-on: macos-15
    environment: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '') && 'release' || 'ci' }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      FORMAL_RELEASE: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '') && secrets.FORMAL_RELEASE_ENABLED == 'true' && secrets.APPLE_CERTIFICATE_P12_BASE64 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 != '' && secrets.APP_STORE_CONNECT_KEY_ID != '' && secrets.APP_STORE_CONNECT_ISSUER_ID != '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must use the vMAJOR.MINOR.PATCH format." >&2
            exit 1
          }
          ./scripts/validate-version.sh "$RELEASE_TAG"
          git fetch --no-tags origin main
          TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
          MAIN_COMMIT="$(git rev-parse origin/main)"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            git merge-base --is-ancestor "$TAG_COMMIT" "$MAIN_COMMIT" || {
              echo "A retried release tag must be part of origin/main history." >&2
              exit 1
            }
          else
            [[ "$TAG_COMMIT" == "$MAIN_COMMIT" ]] || {
              echo "Release tag must point at the current origin/main commit." >&2
              exit 1
            }
          fi

      - name: Install pinned XcodeGen
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Build and test Apple Silicon and Intel apps
        env:
          BUILD_ONLY: "1"
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-release.sh

      - name: Run Xcode unit and integration tests
        run: |
          xcodebuild test \
            -project MenuHub.xcodeproj \
            -scheme MenuHub \
            -destination 'platform=macOS' \
            -skip-testing:MenuHubUITests \
            CODE_SIGNING_ALLOWED=NO

      # GitHub-hosted macOS runners do not contain a Mac Development identity,
      # which XCTest requires to launch an LSUIElement app and its UI runner.
      # Compile the complete UI suite here; execute it on a signed local Mac as
      # part of the release checklist before creating the release tag.
      - name: Compile formal-release UI test bundle
        if: env.FORMAL_RELEASE == 'true'
        timeout-minutes: 15
        run: |
          xcodebuild build-for-testing \
            -project MenuHub.xcodeproj \
            -scheme MenuHub \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Import Developer ID certificate
        if: env.FORMAL_RELEASE == 'true'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/menu-hub.keychain-db"
          PASSWORD="$(openssl rand -hex 24)"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          VERSION="$(cat VERSION)"
          for ARCH in arm64 x86_64; do
            APP="dist/Menu Hub-$VERSION-$ARCH/Menu Hub.app"
            codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
          done

      - name: Notarize and staple
        if: env.FORMAL_RELEASE == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          VERSION="$(cat VERSION)"
          echo "$APP_STORE_CONNECT_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          for ARCH in arm64 x86_64; do
            APP="dist/Menu Hub-$VERSION-$ARCH/Menu Hub.app"
            ZIP="$RUNNER_TEMP/Menu-Hub-$ARCH-notarization.zip"
            ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
            xcrun notarytool submit "$ZIP" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APP_STORE_CONNECT_KEY_ID" --issuer "$APP_STORE_CONNECT_ISSUER_ID" --wait
            xcrun stapler staple "$APP"
            xcrun stapler validate "$APP"
          done

      - name: Package release
        env:
          RELEASE_KIND: ${{ env.FORMAL_RELEASE == 'true' && 'signed' || 'unsigned' }}
        run: |
          ./scripts/package-release.sh
          ./scripts/validate-release-artifacts.sh

      - name: Remove temporary signing material
        if: always() && env.FORMAL_RELEASE == 'true'
        run: |
          security list-keychains -d user -s login.keychain-db
          security lock-keychain "$RUNNER_TEMP/menu-hub.keychain-db" || true
          security delete-keychain "$RUNNER_TEMP/menu-hub.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey.p8"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Menu-Hub-build-${{ github.run_number }}-macOS
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.sha256

  publish-release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs: build-release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      FORMAL_RELEASE: ${{ secrets.FORMAL_RELEASE_ENABLED == 'true' && secrets.APPLE_CERTIFICATE_P12_BASE64 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 != '' && secrets.APP_STORE_CONNECT_KEY_ID != '' && secrets.APP_STORE_CONNECT_ISSUER_ID != '' }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Menu-Hub-build-${{ github.run_number }}-macOS
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t ASSETS < <(find dist -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.sha256' \) -print | sort)
          [[ "${#ASSETS[@]}" == 8 ]] || {
            echo "Expected exactly 8 release assets, found ${#ASSETS[@]}." >&2
            printf '%s\n' "${ASSETS[@]}" >&2
            exit 1
          }
          if gh release view "$RELEASE_TAG" --json isDraft >/tmp/menu-hub-release.json 2>/dev/null; then
            [[ "$(jq -r .isDraft /tmp/menu-hub-release.json)" == true ]] || {
              echo "Release already exists and is public; refusing to replace assets." >&2
              exit 1
            }
          elif [[ "$FORMAL_RELEASE" == "true" ]]; then
            gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes \
              --title "Menu Hub $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" --draft --prerelease --verify-tag --generate-notes \
              --title "Menu Hub $RELEASE_TAG — Unsigned Preview" \
              --notes "Unsigned preview: Apple notarization credentials were not configured. Choose arm64 for Apple Silicon or x86_64 for Intel. macOS may require explicit approval in Privacy & Security."
          fi
          gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
          printf '%s\n' "${ASSETS[@]##*/}" | sort > /tmp/expected-assets.txt
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort > /tmp/remote-assets.txt
          diff -u /tmp/expected-assets.txt /tmp/remote-assets.txt
          if [[ "$FORMAL_RELEASE" == "true" ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --title "Menu Hub $RELEASE_TAG"
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease \
              --title "Menu Hub $RELEASE_TAG — Unsigned Preview"
          fi

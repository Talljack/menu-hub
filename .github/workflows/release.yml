name: macOS Release

on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-15
    env:
      HAS_SIGNING_CREDENTIALS: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
      HAS_NOTARIZATION_CREDENTIALS: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 != '' && secrets.APP_STORE_CONNECT_KEY_ID != '' && secrets.APP_STORE_CONNECT_ISSUER_ID != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: ./scripts/validate-version.sh "${GITHUB_REF_NAME}"

      - name: Require signing and notarization for tagged releases
        if: startsWith(github.ref, 'refs/tags/') && (env.HAS_SIGNING_CREDENTIALS != 'true' || env.HAS_NOTARIZATION_CREDENTIALS != 'true')
        run: |
          echo "Tagged releases require Developer ID signing and Apple notarization credentials." >&2
          exit 1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build and test Universal app
        env:
          BUILD_ONLY: "1"
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-release.sh

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING_CREDENTIALS == 'true'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/menu-hub.keychain-db"
          PASSWORD="$(openssl rand -hex 24)"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "dist/Menu Hub-$(cat VERSION)/Menu Hub.app"
          codesign --verify --deep --strict --verbose=2 "dist/Menu Hub-$(cat VERSION)/Menu Hub.app"

      - name: Notarize and staple
        if: env.HAS_SIGNING_CREDENTIALS == 'true' && env.HAS_NOTARIZATION_CREDENTIALS == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          VERSION="$(cat VERSION)"
          APP="dist/Menu Hub-$VERSION/Menu Hub.app"
          ZIP="$RUNNER_TEMP/Menu-Hub-notarization.zip"
          echo "$APP_STORE_CONNECT_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          xcrun notarytool submit "$ZIP" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APP_STORE_CONNECT_KEY_ID" --issuer "$APP_STORE_CONNECT_ISSUER_ID" --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: Package release
        run: |
          VERSION="$(cat VERSION)"
          APP="dist/Menu Hub-$VERSION/Menu Hub.app"
          ZIP="dist/Menu-Hub-$VERSION-macos-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: Menu-Hub-${{ github.ref_name }}-macOS
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --verify-tag --generate-notes
